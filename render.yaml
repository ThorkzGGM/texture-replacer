services:
  - type: web
    name: unity-texture-replacer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: MAX_BUNDLE_MB
        value: "80"
      - key: MAX_TEXTURE_MB
        value: "20"
